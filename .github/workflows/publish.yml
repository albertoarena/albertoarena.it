name: 📦 Publish

# Builds the site and publishes the static output to the `deploy` branch.
# The Netsons server pulls that branch over HTTPS via a cron job
# (scripts/server-deploy.sh), so no SSH/FTP from CI is involved. See
# docs/plans/completed/server-pull-deployment.md.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Same Rollup workaround as deploy.yml — see that file's comment.
      # Worth testing without it once this pipeline is stable, but that's a
      # separate change from the deploy migration itself.
      - name: Install dependencies and fix Rollup
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install rollup@4.22.4 --save-dev --force
          npm install @rollup/rollup-linux-x64-gnu --save-dev --force || true

      # Refresh install counts on every publish so the deployed /projects
      # numbers are never older than the push. The result is committed back
      # to master by the "Commit project stats" step below, so the repo keeps
      # the numbers too.
      # A Packagist/npm outage must not fail a deploy, so errors are ignored
      # and the committed src/data/project-stats.json stays as the fallback.
      - name: Refresh project stats
        run: npm run projects:fetch-stats
        continue-on-error: true

      - name: Build Astro site
        run: npm run build

      - name: Publish dist to the deploy branch
        run: |
          cd dist
          git init -q
          git checkout -q -b deploy
          git add -A
          git -c user.email=actions@github.com -c user.name="github-actions[bot]" \
            commit -q -m "build: ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Send the refreshed stats to master through a pull request, only when
      # they changed. master requires the "test" check, which rejects a direct
      # bot push. A PR opened with GITHUB_TOKEN does not start the pull_request
      # workflows, so the Test workflow is dispatched by hand on the branch:
      # its "test" check lands on the PR head commit and satisfies the rule.
      # Auto-merge then squashes the PR once that check passes. Runs after the
      # deploy branch is published, and ignores failures: it is bookkeeping.
      - name: Open PR with project stats
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/project-stats.json; then
            echo "No change to project stats."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b bot/project-stats
          git add src/data/project-stats.json
          git commit -m "chore: refresh project install stats"
          git push --force origin bot/project-stats
          if [ -z "$(gh pr list --head bot/project-stats --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base master --head bot/project-stats \
              --title "chore: refresh project install stats" \
              --body "Automated refresh from the Publish workflow."
          fi
          gh workflow run test.yml --ref bot/project-stats
          gh pr merge bot/project-stats --auto --squash

      # 📰 Push the latest posts into the profile README (albertoarena/albertoarena).
      # Reads dist/rss.xml, already built above, no network call to albertoarena.it.
      # Requires the PROFILE_README_TOKEN secret (fine-grained PAT, Contents:
      # read/write, scoped to albertoarena/albertoarena). See
      # docs/plans/completed/profile-readme-push.md.
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          repository: albertoarena/albertoarena
          path: profile
          token: ${{ secrets.PROFILE_README_TOKEN }}

      - name: Update profile README with latest posts
        env:
          RSS_PATH: dist/rss.xml
          PROFILE_README: profile/README.md
        run: node scripts/update-profile-readme.mjs

      - name: Commit and push profile README
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "No change to profile README."
            exit 0
          fi
          git add README.md
          git commit -m "chore: update latest blog posts"
          git push
